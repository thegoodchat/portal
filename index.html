/* Layout idea: dark prototype strip, brand header block with the cool bean as anchor, then single-column cards on Beach. */
:root{
  --beach:#F8F6F0; --nest:#1C1E2A; --eggplant:#3B1E3A;
  --punk:#3843D0; --punk-dark:#14184B; --sun:#FFF30D;
  --coral:#FF6D5F; --coral-dark:#6A2D27; --mint:#00CFC1; --mint-dark:#013C38;
  --bg:var(--beach); --ink:var(--nest); --muted:#5A5C6B;
  --card:#FFFFFF; --line:rgba(28,30,42,.14);
  --accent:var(--punk); --accent-ink:#FFFFFF; --accent-dark:var(--punk-dark);
  --hdr:var(--punk-dark); --hdr-ink:var(--beach);
  --hi:var(--sun); --hi-ink:var(--nest); --bar:var(--punk); --track:#E9E6DC;
  --p-none-bg:#ECE9E0; --p-none-fg:#5A5C6B;
  --p-req-bg:#FFF9A6;  --p-req-fg:#1C1E2A;
  --p-recv-bg:#E3E5FA; --p-recv-fg:#14184B;
  --p-fix-bg:#FFE0DC;  --p-fix-fg:#6A2D27;
  --p-ok-bg:#D2F5F2;   --p-ok-fg:#013C38;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Onest,system-ui,sans-serif;transition:background .2s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.h{font-family:Boldonse,'Archivo Black',Impact,sans-serif;text-transform:uppercase;line-height:1.3;font-weight:400;text-wrap:balance;margin:0}
.bean{border-radius:58% 42% 52% 48% / 46% 58% 42% 54%}

.shape,.av::before{-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
/* prototype strip */
.proto{background:var(--nest);color:#d9d7cf;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;font-size:13px}
.proto b{color:var(--sun);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#2c2f3f;padding:3px;border-radius:999px}
.seg button{border:0;background:transparent;color:#d9d7cf;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--nest);font-weight:600}

/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:relative;overflow:hidden;padding:28px 16px 0}
.hdr .in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.hdr .b1{position:absolute;right:-50px;top:-70px;width:230px;height:230px;background:var(--sun)}
.hdr .b2{position:absolute;right:190px;top:84px;width:74px;height:61px;background:var(--bar);transform:rotate(14deg)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hdr h1{font-size:clamp(22px,5vw,34px);max-width:16em}
.hdr p.sub{margin:10px 0 0;max-width:46ch;opacity:.9}
.tabwrap{position:relative;margin-top:22px}
.tabs{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.45) transparent;padding-bottom:4px}
.tabs::-webkit-scrollbar{height:6px}.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.45);border-radius:3px}
.tabwrap::before,.tabwrap::after{content:"";position:absolute;top:0;bottom:10px;width:44px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}

/* ---------- small renderers ---------- */
const pill = s => `<span class="pill p-${s}">${STATUS[s]}</span>`;
function bar(v, max){ return `<div class="bar" role="img" aria-label="${v} of ${max}"><i style="width:${Math.min(100, v/max*100)}%"></i></div>`; }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}

function kpiLine(f){
  if (!hasData(f.id)) return null;
  return as(f.id, () => { const rows = [];
    [1,2].forEach(c => (S.kpis[c] || []).forEach(k => { if (k.t > 0) rows.push({c, n:k.n, a:kpiActual(k, c), t:k.t}); }));
    const pct = rows.length ? Math.round(100 * rows.reduce((a, x) => a + Math.min(1, x.a / x.t), 0) / rows.length) : null;
    return {rows, pct}; });
}
function board(list, meId){
  const r = ranked(list);
  const mx = compMax(), maxTot = Math.max(1, ...r.map(total));
  const bMain = r.find(f => comps(f)[4] === mx[4]).id;
  const bCivic = mx[2] > 1 ? r.find(f => comps(f)[2] === mx[2]).id : null;
  const rows = r.map((f,i) => {
    const c = comps(f), tot = total(f), me = f.id === meId;
    const badges = (i === 0 ? '<span class="badge">Pace-setter</span>' : '') +
      (f.id === bMain ? '<span class="badge">Collab catalyst</span>' : '') +
      (f.id === bCivic ? '<span class="badge">Community mover</span>' : '');
    const kl = kpiLine(f);
    const klHtml = kl ? `<div class="meta" style="margin:10px 0 4px">The KPIs ${me ? 'you set' : 'they set'}${kl.pct != null ? ': ' + kl.pct + '% of the way on average' : ''}</div>` + (kl.rows.length ? kl.rows.map(x => `<div class="mini"><span>${esc(x.n)} <small class="meta">${CAMPS[x.c-1].n}</small></span>${bar(Math.min(x.a, x.t), x.t)}<span>${fmt(x.a)}/${fmt(x.t)}</span></div>`).join('') : '<div class="meta">No KPIs set yet.</div>') : '';
    const det = S.open === f.id ? `<div class="ldet">${WEIGHTS.map((w,j) =>
      `<div class="mini"><span>${w[0]}</span>${bar(c[j], mx[j])}<span>${c[j]}</span></div>`).join('')}${klHtml}</div>` : '';
    return `<div class="lrow ${me ? 'me' : ''}">
      <button class="lhead" type="button" data-act="expand" data-v="${f.id}" aria-expanded="${S.open === f.id}">
        <span class="rank">${i+1}</span>
        <span class="av ${({TH:'sh-ci',ID:'sh-cl',PH:'sh-sq'})[f.c]}" aria-hidden="true">${f.c}${(f.n.match(/\d+$/) || [''])[0]}</span>
        <span><b>${esc(f.n)}</b>${me ? ' (you)' : ''}<span class="tag">${f.c}</span>${kl && kl.pct != null ? `<span class="tag">KPIs ${kl.pct}%</span>` : ''}${badges}<br>${bar(tot,maxTot)}</span>
        <span class="sc">${tot}</span>
      </button>${det}</div>`;
  }).join('');
  const countries = [...new Set(list.map(f => f.c))];
  const avg = countries.map(c => {
    const m = list.filter(f => f.c === c); return {c, v: Math.round(m.reduce((a,f) => a + total(f), 0) / m.length * 10) / 10};
  });
  const battle = `<div class="card"><h2>Country vs country</h2><p class="sub2">Average points per country. Everyone adds to their team.</p>
    <div class="battle">${avg.map(a => `<div><div class="row spread"><b>${a.c}</b><span>${a.v}</span></div>${bar(a.v, Math.max(1, ...avg.map(x => x.v)))}</div>`).join('')}</div></div>`;
  return {rows, battle};
}

  return out;

const FU = {};
function fileUrl(path){
  if (!path || !LIVE || !SB) return '';

  FU[path] = {url:c ? c.url : '', loading:true, exp:0};
  SB.storage.from('slides').createSignedUrl(path, 3600).then(r => { FU[path] = {url:(r.data && r.data.signedUrl) || '', loading:false, exp:Date.now() + 3300000}; renderSoon(); });

const PH = {};
function photoUrl(path){
  if (!path || !LIVE || !SB) return '';
  const c = PH[path];
  if (c && (c.loading || c.exp > Date.now())) return c.url;
  PH[path] = {url:c ? c.url : '', loading:true, exp:0};
  SB.storage.from('people').createSignedUrl(path, 3600).then(r => { PH[path] = {url:(r.data && r.data.signedUrl) || '', loading:false, exp:Date.now() + 3300000}; renderSoon(); });
  return PH[path].url;
}
function avatar(path, name, sz){
  sz = sz || 64;
  const u = photoUrl(path), ini = String(name || '?').split(/\s+/).map(x => x[0] || '').join('').slice(0, 2).toUpperCase();
  return u ? `<img src="${esc(u)}" alt="" width="${sz}" height="${sz}" style="border-radius:50%;object-fit:cover;flex:none">` : `<span aria-hidden="true" style="width:${sz}px;height:${sz}px;border-radius:50%;background:#DCE9E8;color:#14184B;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none">${esc(ini)}</span>`;
}
const HANDLE = {instagram:['Instagram','https://instagram.com/'], tiktok:['TikTok','https://tiktok.com/@'], facebook:['Facebook','https://facebook.com/'], youtube:['YouTube','https://youtube.com/@'], website:['Website','']};
function handleLinks(h){
  return Object.keys(HANDLE).filter(k => h && h[k]).map(k => { const v = String(h[k]).trim(); const url = /^https?:\/\//i.test(v) ? v : (HANDLE[k][1] ? HANDLE[k][1] + v.replace(/^@/, '') : 'https://' + v); return lnk(url, HANDLE[k][0]); }).join(', ');
}
function resizeImage(file){
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('image')), 'image/jpeg', 0.85); };
    img.onerror = () => rej(new Error('image')); img.src = u; });
}

function fellowEng(f){
  if (!hasData(f.id)) return null;
  const d = fd(f.id), rows = [...d.posts.map(p => p.refl || null), ...d.friends.flatMap(x => x.posts.map(q => q.m || null))].filter(Boolean);
  const sum = k => rows.reduce((a, m) => a + (Number(m[k]) || 0), 0);
  const eng = sum('reactions') + sum('comments') + sum('saves') + sum('shares') + sum('repost');
  return {posts:d.posts.length + d.friends.reduce((a, x) => a + x.posts.length, 0), reach:sum('reach'), eng, rate:sum('reach') ? (Math.round(eng / sum('reach') * 1000) / 10) + '%' : '0%'};
}

function tabsFit(reveal){

  if (reveal) { const a = t.querySelector('[aria-selected="true"]'); if (a) { const l = a.offsetLeft - 40, r = a.offsetLeft + a.offsetWidth + 40; if (l < t.scrollLeft) t.scrollLeft = Math.max(0, l); else if (r > t.scrollLeft + t.clientWidth) t.scrollLeft = r - t.clientWidth; } }
  const upd = () => { w.classList.toggle('more-l', t.scrollLeft > 4); w.classList.toggle('more-r', t.scrollLeft + t.clientWidth < t.scrollWidth - 4); };
  upd(); if (!t._fit) { t._fit = true; t.addEventListener('scroll', upd, {passive:true}); window.addEventListener('resize', upd);
    document.getElementById('tabL').addEventListener('click', () => { t.scrollBy({left:-(t.clientWidth * .7), behavior:'smooth'}); });

const IU = {};
function insightUrl(path){
  if (!path || !SB) return '';
  const c = IU[path];
  if (c && (c.loading || c.exp > Date.now())) return c.url;
  IU[path] = {url:c ? c.url : '', loading:true, exp:0};
  SB.storage.from('insights').createSignedUrl(path, 3600).then(r => { IU[path] = {url:(r.data && r.data.signedUrl) || '', loading:false, exp:Date.now() + 3300000}; renderSoon(); });
  return IU[path].url;
}
const IUD = {};
function insightDl(path, name){
  if (!path || !SB) return '';
  const c = IUD[path];
  if (c && (c.loading || c.exp > Date.now())) return c.url;
  IUD[path] = {url:c ? c.url : '', loading:true, exp:0};
  SB.storage.from('insights').createSignedUrl(path, 3600, {download:name || true}).then(r => { IUD[path] = {url:(r.data && r.data.signedUrl) || '', loading:false, exp:Date.now() + 3300000}; renderSoon(); });

    pl.action.log = [...(pl.action.log || []), {id:Date.now(), date:g('a-date') || iso(TODAY), count:n, note:g('a-note')}]; render(); toast('Thank you. That is real change.');
  }

    S.events.push({id:Date.now(), camp:S.camp, name:g('e-name').trim(), type:g('e-type'), date:dstr(d), place:g('e-place'), attendance:Number(g('e-att')) || 0, echo:g('e-echo') || 'Not yet'}); render(); toast('Event saved.');
  }

  }

    const p = S.posts.find(x => x.id === Number(e.target.dataset.id)), fid = CUR, vals = {...readMetrics('r'), happened:g('r-h'), surprise:g('r-s'), change:g('r-c')};
    toast(LIVE ? 'Saving your screenshots...' : 'Saving...');
    putShots(fid, p.id).then(sh => { S.shots = []; p.refl = {...vals, shots:LIVE ? sh.map(x => x.path ? {name:x.name, path:x.path} : x) : sh}; $('#modal').innerHTML = ''; render(); toast('Reflection saved. Your learning score went up.'); })
      .catch(() => toast('The screenshots could not be uploaded. Check your connection and try again.'));
  }
});

/* ---------- live mode: real logins and shared, real-time data ---------- */
let SB = null, PROFILE = null, LAST = {}, FLUSH_T = null, RENDER_T = null, CH = null;
S.live = {phase:'loading', msg:''};
const LISTS = ['pevents','cevents','boosts','feed','csos','support','asks','slides','classes','dates','features','keylinks','inspo','ready'];
const MAPS = ['paper','notes','org','reminded','followed','camps'];
const LISTEN2 = ['pre','post'], LISTEN1 = ['bench','cmp','data','decks','sec'];
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const wrap = v => isObj(v) ? v : {_v:v};
const unwrap = d => d && Object.keys(d).length === 1 && '_v' in d ? d._v : d;
function stable(o){ return JSON.stringify(o, (k, v) => isObj(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v); }
const FLISTS = ['posts','events','collabs','friends'];
const planBlank = p => !p || (!p.message && !p.audience && !(p.posts || []).length && !(p.events || []).length && !(p.lines || []).length && !(p.action && (p.action.type || p.action.text || p.action.measure)) && (p.status || 'Draft') === 'Draft' && !p.comment);
function applyFp(key, d, remove){
  const [fid, frid, pid] = key.split('/'), a = fpList(fid, frid), j = a.findIndex(x => String(x.id) === pid);
  if (remove) { if (j >= 0) a.splice(j, 1); return; }
  if (!isObj(d)) return;
  if (j >= 0) a[j] = d; else a.push(d);
}
function applyFd(n, key, d, remove){
  const i = key.indexOf('/'), fid = key.slice(0, i), k = key.slice(i + 1), D = fd(fid);
  if (n === 'plan' || n === 'setup' || n === 'kpis') { const c = Number(k); if (remove) D[n][c] = n === 'plan' ? epPlan() : n === 'kpis' ? [] : null; else D[n][c] = d; return; }
  if (!FLISTS.includes(n)) return;
  const a = D[n], j = a.findIndex(x => String(x.id) === k);
  if (remove) { if (j >= 0) a.splice(j, 1); return; }
  if (!isObj(d)) return;
  if (n === 'posts' && d.date && !(d.date instanceof Date)) d.date = new Date(String(d.date).slice(0, 10) + 'T00:00:00');
  if (n === 'friends') d.posts = fpList(fid, d.id);
  if (j >= 0) a[j] = d; else a.push(d);
}
function collect(){
  const out = {}, put = (kind, key, val) => { out[kind + '|' + key] = {kind, key:String(key), data:wrap(val)}; };
  LISTS.forEach(n => (S[n] || []).forEach(x => put('list:' + n, x.id, x)));
  MAPS.forEach(n => Object.keys(S[n] || {}).forEach(k => put('map:' + n, k, S[n][k])));
  LISTEN2.forEach(n => Object.keys(S.listen[n] || {}).forEach(f => Object.keys(S.listen[n][f] || {}).forEach(c => put('listen:' + n, f + '/' + c, S.listen[n][f][c]))));
  LISTEN1.forEach(n => Object.keys(S.listen[n] || {}).forEach(k => put('listen:' + n, k, S.listen[n][k])));
  const isFriend = !!PROFILE && PROFILE.role === 'friend';
  Object.keys(FD).forEach(fid => { const d = FD[fid];
    d.friends.forEach(fr => fr.posts.forEach(q => { if (q && q.id != null) put('fp:posts', fid + '/' + fr.id + '/' + q.id, q); }));
    if (isFriend) return; // a KOL friend only ever saves their own posts
    FLISTS.forEach(n => d[n].forEach(x => { if (x && x.id != null) put('fd:' + n, fid + '/' + x.id, n === 'posts' && x.date instanceof Date ? {...x, date:iso(x.date)} : n === 'friends' ? (({posts, ...rest}) => rest)(x) : x); }));
    [1,2].forEach(c => { if (!planBlank(d.plan[c])) put('fd:plan', fid + '/' + c, d.plan[c]); if (d.setup[c]) put('fd:setup', fid + '/' + c, d.setup[c]); if (d.kpis[c] && d.kpis[c].length) put('fd:kpis', fid + '/' + c, d.kpis[c]); });
  });
  return out;
}
function blankLive(){
  Object.keys(FD).forEach(k => delete FD[k]);
  Object.keys(FPS).forEach(k => delete FPS[k]);
  S.shots = [];
  IMP = null; IMP_T = 0;
  LISTS.forEach(n => { S[n] = []; });
  S.notes = {}; S.reminded = {}; S.followed = {}; S.paper = {}; S.camps = {};
  S.org = {TH:{...ORG_DEFAULT}, ID:{...ORG_DEFAULT}};
  F.forEach(f => { S.paper[f.id] = DOCS.map(d => ({doc:d, s:'none', note:'', due:''})); });
  S.listen = {pre:{}, post:{}, cmp:{}, bench:{}, data:{}, decks:{}, sec:{}};
  S.accounts = []; S.pedit = null; S.pinv = null; S.csoNotes = [];
}
function applyRec(r, remove){
  const [t, n] = r.kind.split(':'), key = r.key, d = remove ? null : unwrap(r.data);
  if (!remove && ((n === 'paper' && !Array.isArray(d)) || (n === 'notes' && !Array.isArray(d)) || (t === 'list' && !isObj(d)))) return; // ignore malformed rows
  if (t === 'fp') { applyFp(key, d, remove); return; }
  if (t === 'fd') { applyFd(n, key, d, remove); return; }
  if (t === 'list') { const a = S[n]; if (!a) return; const i = a.findIndex(x => String(x.id) === key); if (remove) { if (i >= 0) a.splice(i, 1); } else if (i >= 0) a[i] = d; else a.push(d); }
  else if (t === 'map') { if (remove) delete S[n][key]; else S[n][key] = d; }
  else if (t === 'listen') {
    if (LISTEN2.includes(n)) { const [f, c] = key.split('/'); S.listen[n][f] = S.listen[n][f] || {}; if (remove) delete S.listen[n][f][c]; else S.listen[n][f][c] = d; }
    else if (remove) delete S.listen[n][key]; else S.listen[n][key] = d;
  }
}
async function loadAll(){
  const {data, error} = await SB.from('records').select('*');
  if (error) throw error;
  (data || []).forEach(r => applyRec(r, false));
  const fr = await SB.from('fellows').select('*'); (fr.data || []).forEach(applyFellow);
  try { const pv = await SB.from('fellow_private').select('*'); FPRIV = {}; (pv.data || []).forEach(x => { FPRIV[x.fellow_id] = {email:x.email || '', phone:x.phone || '', line:x.line || '', whatsapp:x.whatsapp || '', folder:x.folder_url || ''}; }); } catch (e) {}
  LAST = {}; const c = collect(); Object.keys(c).forEach(id => { LAST[id] = stable(c[id].data); });
}
function scheduleFlush(){ if (S.live.phase !== 'ready' || VA) return; clearTimeout(FLUSH_T); FLUSH_T = setTimeout(flush, 500); }
async function flush(){
  if (S.live.phase !== 'ready' || VA) return;
  const cur = collect(), up = [], del = [];
  Object.keys(cur).forEach(id => { const j = stable(cur[id].data); if (LAST[id] !== j) up.push({id, row:{kind:cur[id].kind, key:cur[id].key, data:cur[id].data}, j}); });
  Object.keys(LAST).forEach(id => { if (!cur[id]) del.push(id); });
  if (!up.length && !del.length) return;
  try {
    if (up.length) { const {error} = await SB.from('records').upsert(up.map(u => u.row), {onConflict:'kind,key'}); if (error) throw error; up.forEach(u => { LAST[u.id] = u.j; }); }
    for (const id of del) { const [k, ...rest] = id.split('|'); const {error} = await SB.from('records').delete().eq('kind', k).eq('key', rest.join('|')); if (error) throw error; delete LAST[id]; }
  } catch (e) {
    toast('Could not save that. You may not have permission, or the connection dropped. Showing the saved version.');
    try { const keep = S.live; blankLive(); await loadAll(); S.live = keep; renderSoon(); } catch (x) { console.error('reload failed', x); }
  }
}
function renderSoon(){
  clearTimeout(RENDER_T);
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if (typing) { RENDER_T = setTimeout(renderSoon, 1500); return; }
  render();
}
function subscribe(){
  if (CH) SB.removeChannel(CH);
  CH = SB.channel('records').on('postgres_changes', {event:'*', schema:'public', table:'records'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if (!r || !r.kind) return;
    const id = r.kind + '|' + r.key;
    if (p.eventType === 'DELETE') { if (!(id in LAST)) return; delete LAST[id]; applyRec(r, true); renderSoon(); return; }
    const j = stable(r.data); if (LAST[id] === j) return;
    LAST[id] = j; applyRec(r, false); renderSoon();
  }).on('postgres_changes', {event:'*', schema:'public', table:'fellows'}, p => { if (p.new && p.new.id) { applyFellow(p.new); renderSoon(); } }).subscribe();
}
function applyRole(p){
  S.live = {phase:'ready', msg:''}; S.scope = 'ALL'; S.tm = 'program'; S.prog = 'gc';
  if (p.role === 'program') { S.role = 'team'; S.teamTab = 'over'; }
  else if (p.role === 'country') { S.role = 'team'; S.tm = 'country'; S.scope = p.country; S.teamTab = 'people'; S.coord = (F.find(f => f.c === p.country) || F[0]).id; }
  else if (p.role === 'listener' || p.role === 'comms') { S.role = 'listener'; S.teamTab = 'lbench'; }
  else if (p.role === 'ops') { S.role = 'team'; S.tm = 'ops'; S.teamTab = 'paper'; }
  else if (p.role === 'partner') { S.role = 'partner'; S.teamTab = 'pimpact'; }
  else if (p.role === 'friend') { S.role = 'friend'; S.tab = 'fhome'; S.scope = p.country; }
  else if (p.role === 'fellow') { S.role = 'kol'; S.tab = 'home'; S.scope = p.country; CUR = p.fellow_id || CUR; }
  S.user = {role:S.role, label:p.label, scope:S.scope, country:p.country};
  S.lf = CUR;
}
async function liveBoot(){
  render();
  if (!window.supabase) { S.live = {phase:'error', msg:'The sign-in library did not load. Check your connection and refresh.'}; render(); return; }
  SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  if (/type=(recovery|invite)/.test(location.hash)) { S.live = {phase:'recover', msg:''}; render(); return; }
  const {data} = await SB.auth.getSession();
  if (data && data.session) await liveEnter(); else { S.live = {phase:'login', msg:''}; render(); }
}
async function loadFriendCtx(){
  const r = await SB.rpc('friend_context'), c = r && r.data;
  if (!c || !c.fellow) return false;
  CUR = c.fellow;
  const D = fd(CUR), fr = Object.assign({}, c.friend, {token:'', posts:fpList(CUR, c.friend.id)});
  D.friends = [fr];
  const camp = Number(fr.camp) || 1;
  D.plan[camp].message = c.message || ''; D.plan[camp].action = Object.assign({type:'', text:'', measure:''}, c.action || {});
  D.setup[camp] = {name:c.campaign || '', type:c.type || '', partners:[]};
  LAST = {}; const cc = collect(); Object.keys(cc).forEach(id => { LAST[id] = stable(cc[id].data); });
  return true;
}
async function liveEnter(){
  S.live = {phase:'loading', msg:''}; render();
  try {
    const {data:{user}} = await SB.auth.getUser();
    const {data:prof, error} = await SB.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error;
    if (!prof || !prof.active) { S.user = null; S.live = {phase:'blocked', msg:'Your account is not set up yet. Ask the programme team to finish it.'}; render(); return; }
    PROFILE = prof;
    if (['cso'].includes(prof.role)) { S.user = null; S.live = {phase:'blocked', msg:'Your account is ready. Your page is still being built and will open here soon. Thank you for waiting.'}; render(); return; }
    blankLive(); await loadAll();
    if (prof.role === 'friend' && !(await loadFriendCtx())) { S.user = null; S.live = {phase:'blocked', msg:'Your login is ready, but it is not linked to an invitation yet. Ask the programme team.'}; render(); return; }
    applyRole(prof); if (['program','country','comms'].includes(prof.role)) await loadAccounts(); subscribe(); render();
  } catch (e) { S.user = null; S.live = {phase:'error', msg:'Something went wrong while opening the portal. Refresh and try again.'}; render(); }
}
async function liveLogin(email, pw){
  S.live = {phase:'loading', msg:''}; render();
  const {error} = await SB.auth.signInWithPassword({email:email.trim(), password:pw});
  if (error) { S.live = {phase:'login', msg:'Email or password is incorrect. Check both and try again.', email}; render(); return; }
  await liveEnter();
}
async function liveLogout(){ if (CH) SB.removeChannel(CH); CH = null; await SB.auth.signOut(); PROFILE = null; S.user = null; S.live = {phase:'login', msg:''}; render(); }
async function liveForgot(email){
  if (!email || !email.trim()) { toast('Type your email first, then choose Forgot password.'); return; }
  await SB.auth.resetPasswordForEmail(email.trim(), {redirectTo:location.origin + location.pathname});

async function liveNewPw(pw){
  if (!pw || pw.length < 10) { S.live = {phase:'recover', msg:'Use at least 10 characters.'}; render(); return; }
  const {error} = await SB.auth.updateUser({password:pw});

}
function vLiveLogin(){
  const L = S.live || {};

      <label class="f">Email<input type="email" id="l-email" autocomplete="username" value="${esc(L.email || '')}" required></label>
      <label class="f">Password<input type="password" id="l-pw" autocomplete="current-password" required></label>
      <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" data-act="showpw"> Show password</label>
      ${L.msg ? `<div class="alert need" role="alert" style="padding:12px 16px">${esc(L.msg)}</div>` : ''}
      <div class="row spread"><button class="btn" type="submit">Sign in</button><button class="btn ghost sm" type="button" data-act="forgot">Forgot password?</button></div></form>
    <p class="note">Accounts are created by the programme team. If you cannot sign in, ask them.</p><div style="border-top:1px solid var(--line);padding-top:14px"><a class="btn ghost" href="demo.html">View the demo page</a><p class="note" style="margin-top:8px">Made-up names and numbers. No login needed.</p></div>`);
}
function stripSample(){

if (LIVE) stripSample();
document.addEventListener('input', () => { if (LIVE) scheduleFlush(); });
document.addEventListener('change', () => { if (LIVE) scheduleFlush(); });
if (DEMO) { const t = document.getElementById('protoText'); t.innerHTML = '<b>DEMO PAGE</b>: This is a demo with made-up names and numbers, not the real portal. Nothing here is saved, and changes reset when you reload. Use the role menu to see each view. <a href="' + location.pathname + '" style="display:inline-block;margin-left:8px;padding:3px 12px;border-radius:999px;background:#fff;color:#3B1E3A;font-weight:700;text-decoration:none">Back to sign in</a>'; document.title = 'DEMO, ' + document.title; }
else if (LIVE) { const t = document.getElementById('protoText'); t.textContent = 'The Good Chat portal, makesense Asia'; }
const DEMO_PW = 'makesenseasia';
